product:
  type: kmp/lib
  platforms: [jvm, android, wasmJs]

aliases:
  - jvmAndAndroid: [jvm, android]

dependencies:
  - ../shared: exported
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.components.resources
  - $libs.androidx.lifecycle.runtime.compose
